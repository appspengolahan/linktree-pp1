<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Golden Fish Scales / Body Gradient -->
    <linearGradient id="fishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="fishFin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Green Bar Gradient -->
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Scale Pattern -->
    <pattern id="fishScalePattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0,6 Q 6,0 12,6 Q 6,12 0,6" fill="none" stroke="#b45309" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Central White Arch Background -->
  <path d="M 125 260 A 125 110 0 0 1 375 260 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

  <!-- Triangle Top Crest Background -->
  <polygon points="250,90 220,160 280,160" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />

  <!-- Left Golden Fish -->
  <g id="leftFish">
    <!-- Body Curve -->
    <path d="M 245 106 
             C 180 108, 120 160, 95 240 
             C 88 265, 88 280, 110 285 
             C 125 288, 130 260, 142 225 
             C 160 170, 205 150, 245 156 
             Z" 
          fill="url(#fishGold)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Pattern Overlay for Scales -->
    <path d="M 235 112 
             C 185 114, 128 165, 105 235 
             C 98 258, 100 275, 115 278 
             C 123 265, 132 235, 145 215 
             C 165 170, 205 152, 235 155 Z" 
          fill="url(#fishScalePattern)" opacity="0.75"/>

    <!-- Left Fish Head Detail -->
    <path d="M 245 106 C 220 115, 205 130, 205 155 C 225 157, 240 156, 245 156 Z" fill="none" stroke="#000000" stroke-width="3"/>
    <!-- Eye & Whisker -->
    <ellipse cx="230" cy="132" rx="4" ry="7" fill="#000000"/>
    <circle cx="231" cy="130" r="1.5" fill="#ffffff"/>
    <path d="M 226 122 C 220 120, 215 125, 212 135" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 238 126 C 235 122, 228 122, 224 125" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M 218 142 C 210 146, 205 140, 200 138" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Fish Tail / Pectoral Fin Bulb -->
    <ellipse cx="130" cy="312" rx="16" ry="25" fill="url(#fishFin)" stroke="#000000" stroke-width="4"/>
    <path d="M 125 295 C 132 305, 132 320, 126 330" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Right Golden Fish -->
  <g id="rightFish">
    <!-- Body Curve -->
    <path d="M 255 106 
             C 320 108, 380 160, 405 240 
             C 412 265, 412 280, 390 285 
             C 375 288, 370 260, 358 225 
             C 340 170, 295 150, 255 156 
             Z" 
          fill="url(#fishGold)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Pattern Overlay for Scales -->
    <path d="M 265 112 
             C 315 114, 372 165, 395 235 
             C 402 258, 400 275, 385 278 
             C 377 265, 368 235, 355 215 
             C 335 170, 295 152, 265 155 Z" 
          fill="url(#fishScalePattern)" opacity="0.75"/>

    <!-- Right Fish Head Detail -->
    <path d="M 255 106 C 280 115, 295 130, 295 155 C 275 157, 260 156, 255 156 Z" fill="none" stroke="#000000" stroke-width="3"/>
    <!-- Eye & Whisker -->
    <ellipse cx="270" cy="132" rx="4" ry="7" fill="#000000"/>
    <circle cx="269" cy="130" r="1.5" fill="#ffffff"/>
    <path d="M 274 122 C 280 120, 285 125, 288 135" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 262 126 C 265 122, 272 122, 276 125" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M 282 142 C 290 146, 295 140, 300 138" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Fish Tail / Pectoral Fin Bulb -->
    <ellipse cx="370" cy="312" rx="16" ry="25" fill="url(#fishFin)" stroke="#000000" stroke-width="4"/>
    <path d="M 375 295 C 368 305, 368 320, 374 330" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Number 153 -->
  <g id="number153">
    <!-- Subtle drop text shadow -->
    <text x="250" y="248" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="86" 
          font-weight="900" 
          letter-spacing="2"
          text-anchor="middle" 
          fill="#dc2626" 
          stroke="#000000" 
          stroke-width="5" 
          stroke-linejoin="round">
      153
    </text>
  </g>

  <!-- Green Ribbon Bar -->
  <rect x="75" y="260" width="350" height="36" rx="2" fill="url(#greenBar)" stroke="#000000" stroke-width="3.5"/>

  <!-- PT. BATU KARANG Text in Serif inside green bar -->
  <text x="250" y="286" 
        font-family="'Times New Roman', 'Georgia', serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="1.5"
        text-anchor="middle" 
        fill="#000000">
    PT. BATU KARANG
  </text>

  <!-- DIVISI PRODUKSI I in Bold Sans below bar -->
  <text x="250" y="360" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="3"
        text-anchor="middle" 
        fill="#000000">
    DIVISI PRODUKSI I
  </text>
</svg>
